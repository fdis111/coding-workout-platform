<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="description" content="Pandas Quest - une leçon jouable à la fois." />
    <title>Pandas Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lesson-app">
      <header class="lesson-header">
        <button class="close-button" id="restartBtn" aria-label="Recommencer le parcours">×</button>
        <div class="segments" id="segments" aria-label="Progression de la leçon"></div>
        <div class="energy"><b id="xpValue">0</b><span>ϟ</span></div>
      </header>

      <section class="lesson-content">
        <p class="eyebrow" id="eyebrow">NIVEAU 1 · FILTRER</p>
        <h1 id="title">Le carnet des bonnes ventes</h1>
        <p class="story" id="story"></p>

        <article class="data-card">
          <div class="data-bar"><span>ventes_du_jour</span><small id="dataSize">4 lignes</small></div>
          <div class="table-holder" id="dataTable"></div>
        </article>

        <section class="question-block">
          <p class="question-number" id="questionNumber">DÉFI 1 · 10</p>
          <h2 id="question">Quel code conserve uniquement les ventes au-dessus de 400 ?</h2>
          <div class="choices" id="choices" role="radiogroup" aria-label="Choisis une réponse"></div>
        </section>

        <aside class="explanation" id="explanation" aria-live="polite">
          <span id="explanationIcon">✦</span><p id="explanationText">Sélectionne une réponse pour continuer.</p>
        </aside>
      </section>

      <footer class="lesson-footer">
        <button class="why-button" id="whyBtn"><span>?</span> Explique-moi</button>
        <button class="submit-button" id="submitBtn" disabled>Valider</button>
      </footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
